name: Flip package visibility

on:
  workflow_dispatch:

permissions:
  packages: write
  contents: read

jobs:
  flip:
    runs-on: ubuntu-latest
    steps:
      - name: Make @deryk-ryloy/ron public
        run: |
          echo "trying unscoped name"
          gh api -X PATCH /user/packages/npm/ron -f visibility=public || true
          echo "trying scoped name"
          gh api -X PATCH "/user/packages/npm/%40deryk-ryloy%2Fron" -f visibility=public || true
          echo "--- verify ---"
          gh api "/user/packages/npm/ron" --jq '{name, visibility}' || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
