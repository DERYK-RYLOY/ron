*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:transparent;color-scheme:light dark}
body{
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;
  font-family:'RON Black',sans-serif;
  -webkit-font-smoothing:antialiased;
}
.stage{display:flex;align-items:flex-end;justify-content:center}
.typed{
  white-space:pre;
  line-height:1;
  font-size:clamp(3.5rem,17vw,9rem);
  letter-spacing:.06em;
  color:light-dark(#16181d,#eef1f4);
  transition:opacity .28s ease;
}
@media (prefers-color-scheme: light){.typed{color:#16181d}}
.typed.fading{opacity:0}
.caret{
  width:.32em;height:.78em;
  margin-left:.12em;
  background:#d8ff3a;
  align-self:center;
  border-radius:0;
  clip-path:polygon(22% 0,78% 0,100% 14%,100% 86%,78% 100%,22% 100%,0 86%,0 14%);
  animation:blink 1.05s steps(1,end) infinite;
}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
</style>
</head>
<body>
  <div class="stage"><span class="typed" id="typed"></span><span class="caret" aria-hidden="true"></span></div>
<script>
// RON typewriter — type ABC, delete, type 123, delete, next RON style, repeat forever.
// Human-like keystroke timing, randomized per keystroke (same algorithm the reference demo used).
const SEQUENCE = ["ABC", "123"];
const STYLES = ["RON Black", "RON Mono", "RON Dot", "RON Scan", "RON Outline"];
const BASE = 270;                  // ms per keystroke (Normal speed)
const HOT = new Set(["a","e","t","o","i","n","s","r"]);

const el = document.getElementById("typed");
let styleIdx = 0, seqIdx = 0, count = 0, phase = "typing", wordGone = false;

function applyStyle() {
  el.style.fontFamily = "'" + STYLES[styleIdx] + "',sans-serif";
  el.style.opacity = 1;
}
function keyDelay(ch) {
  let d = BASE * (0.82 + Math.random() * 0.46);       // ±23% jitter
  if (ch === " ") d *= 1.6;
  else if (HOT.has(ch.toLowerCase())) d *= 0.82;
  else if (/[0-9]/.test(ch)) d *= 1.08;
  if (Math.random() < 0.05) d += 320 + Math.random() * 340;  // 5% "thinking" pause
  return Math.max(34, d);
}
function backspaceDelay() {
  return Math.max(24, BASE * 0.62 * (0.78 + Math.random() * 0.52));
}
function tick() {
  const word = SEQUENCE[seqIdx];
  if (phase === "typing") {
    if (count >= word.length) { wordGone = false; phase = "pausing"; return setTimeout(tick, 2100 + Math.random() * 500); }
    count++;
    el.textContent = word.slice(0, count);
    return setTimeout(tick, keyDelay(word[count - 1]));
  }
  if (phase === "pausing") {
    if (wordGone) {
      // finished deleting this word — move on
      if (seqIdx === SEQUENCE.length - 1) {
        styleIdx = (styleIdx + 1) % STYLES.length;
        el.classList.add("fading");
        setTimeout(() => { applyStyle(); el.classList.remove("fading"); }, 240);
      }
      seqIdx = (seqIdx + 1) % SEQUENCE.length;
      wordGone = false;
      phase = "typing";
      return setTimeout(tick, 700 + Math.random() * 300);
    }
    phase = "deleting";
    return setTimeout(tick, 0);
  }
  if (phase === "deleting") {
    if (count <= 0) { wordGone = true; phase = "pausing"; return setTimeout(tick, 820 + Math.random() * 360); }
    count--;
    el.textContent = word.slice(0, count);
    return setTimeout(tick, backspaceDelay());
  }
}
applyStyle();
tick();
</script>
</body>
</html>
