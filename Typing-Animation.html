:root {
  color-scheme: dark;
  --surface: #23272e;
  --text: #f6f7f8;
  --muted: #8f98a6;
  --line: rgba(255,255,255,.12);
}

@media (prefers-color-scheme: dark) {
  :root {
    --surface: #23272e;
    --text: #f6f7f8;
    --muted: #8f98a6;
  }
}

* {
  box-sizing: border-box;
}

html, body, #root {
  margin: 0;
  min-height: 100%;
}

body {
  background: var(--surface);
  color: var(--text);
  font-family: "Manrope", system-ui, sans-serif;
  overflow-x: clip;
}

button {
  font: inherit;
}

.app-shell {
  min-height: 100svh;
  padding-top: var(--safe-area-inset-top);
  position: relative;
  overflow-x: clip;
  overflow-y: clip;
  background: #23272e;
  color: #f8f9fa;
  display: flex;
  flex-direction: column;
  isolation: isolate;
  transition: background-color .9s ease, color .9s ease;
}

/* Design 1 — Clean Modern */

.app-shell[data-design="0"] {
  --type-font: "Manrope", system-ui, sans-serif;
  --type-color: #ffffff;
  --muted: #a9b0bc;
  --line: rgba(255,255,255,.16);
  --accent: #ffffff;
  --control-bg: rgba(16,19,24,.72);
  --control-text: #e8ebef;
  background: #23272e;
}

/* Design 2 — Editorial Serif */

.app-shell[data-design="1"] {
  color-scheme: light;
  --type-font: "Fraunces", Georgia, serif;
  --type-color: #1d1a15;
  --muted: #776f62;
  --line: rgba(29,26,21,.22);
  --accent: #1d1a15;
  --control-bg: rgba(255,252,244,.82);
  --control-text: #1d1a15;
  background: #f6f0e2;
  color: #1d1a15;
}

/* Design 3 — Mono Terminal */

.app-shell[data-design="2"] {
  --type-font: "JetBrains Mono", ui-monospace, monospace;
  --type-color: #3dff7a;
  --muted: #5f9d76;
  --line: rgba(61,255,122,.28);
  --accent: #3dff7a;
  --control-bg: rgba(1,14,7,.82);
  --control-text: #c9ffdc;
  background: #020603;
  color: #3dff7a;
}

/* Design 4 — Bold Playful */

.app-shell[data-design="3"] {
  --type-font: "Archivo Black", "Arial Black", sans-serif;
  --type-color: #ffffff;
  --muted: #e8c8ff;
  --line: rgba(255,255,255,.24);
  --accent: #ffd166;
  --control-bg: rgba(22,4,42,.72);
  --control-text: #fff;
  background: radial-gradient(circle at 50% 30%, #4a147d 0, #2a0a4a 58%, #18052e 100%);
  color: #fff;
}

.design-fade {
  width: 100%;
  animation: designFade .9s ease both;
}

@keyframes designFade {
  from {
    opacity: 0;
    transform: translateY(8px);
    filter: blur(2px);
  }

  to {
    opacity: 1;
    transform: translateY(0);
    filter: blur(0);
  }
}

.design-indicator {
  width: min(1180px, calc(100% - 40px));
  margin: 18px auto 0;
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 10px;
  font-size: 12px;
  letter-spacing: .02em;
  color: var(--muted);
  transition: color .8s;
}

.design-count {
  font-weight: 800;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--accent);
}

.design-indicator strong {
  color: var(--type-color, currentColor);
  font-size: 13px;
}

.design-font {
  font-family: var(--type-font);
}

.design-sep {
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: var(--muted);
}

.design-dots {
  display: inline-flex;
  gap: 5px;
  margin-left: 2px;
}

.design-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--muted);
  opacity: .45;
  transition: .3s;
}

.design-dot.active {
  opacity: 1;
  background: var(--accent);
  transform: scale(1.25);
}

.bg-grid {
  position: absolute;
  inset: 0;
  opacity: .17;
  background-image: linear-gradient(rgba(255,255,255,.08) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.08) 1px, transparent 1px);
  background-size: 72px 72px;
  -webkit-mask-image: radial-gradient(ellipse at center, black 20%, transparent 78%);
          mask-image: radial-gradient(ellipse at center, black 20%, transparent 78%);
  z-index: -1;
}

.blob {
  position: absolute;
  width: 38vw;
  height: 38vw;
  border-radius: 50%;
  filter: blur(95px);
  opacity: .18;
  z-index: -1;
  transition: background 1s ease;
}

.blob-one {
  left: -10vw;
  top: -8vw;
  background: var(--ga);
  animation: drift 15s ease-in-out infinite alternate;
}

.blob-two {
  right: -10vw;
  bottom: -9vw;
  background: var(--gc);
  animation: drift2 18s ease-in-out infinite alternate;
}

.vignette {
  position: absolute;
  inset: 0;
  background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.55));
  z-index: -1;
}

.app-shell[data-design="0"] .bg-grid, .app-shell[data-design="0"] .blob, .app-shell[data-design="0"] .vignette {
  opacity: 0;
}

.app-shell[data-design="1"] .bg-grid {
  opacity: .06;
  background-image: linear-gradient(rgba(29,26,21,.2) 1px, transparent 1px);
}

.app-shell[data-design="1"] .blob, .app-shell[data-design="1"] .vignette {
  opacity: 0;
}

.app-shell[data-design="2"] .bg-grid {
  opacity: .18;
  background-image: repeating-linear-gradient(0deg, rgba(61,255,122,.08) 0 1px, transparent 1px 4px);
  -webkit-mask-image: none;
          mask-image: none;
}

.app-shell[data-design="2"] .blob, .app-shell[data-design="2"] .vignette {
  opacity: 0;
}

.app-shell[data-design="3"] .blob {
  opacity: .42;
}

.app-shell[data-design="3"] .bg-grid {
  opacity: .1;
}

.app-shell[data-design="3"] .vignette {
  opacity: .7;
}

@keyframes drift {
  to {
    transform: translate(8vw, 8vh) scale(1.15);
  }
}

@keyframes drift2 {
  to {
    transform: translate(-7vw, -8vh) scale(.9);
  }
}

.topbar {
  width: min(1180px, calc(100% - 40px));
  margin: 22px auto 0;
  display: flex;
  justify-content: space-between;
  align-items: center;
  color: var(--muted);
  font-size: 11px;
  letter-spacing: .18em;
  font-weight: 600;
  transition: color .8s;
}

.eyebrow {
  display: flex;
  align-items: center;
  gap: 8px;
}

.live-dot {
  width: 7px;
  height: 7px;
  background: var(--accent);
  border-radius: 50%;
  box-shadow: 0 0 12px var(--glow);
}

.app-shell[data-design="1"] .live-dot {
  box-shadow: none;
}

.app-shell[data-design="2"] .live-dot {
  box-shadow: 0 0 12px rgba(61,255,122,.8);
}

.brand {
  display: flex;
  align-items: center;
  gap: 7px;
  color: inherit;
}

.stage {
  flex: 1;
  min-height: 0;
  width: min(1160px, calc(100% - 40px));
  margin: auto;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
}

.kicker {
  margin: 0 0 28px;
  color: var(--muted);
  font: 600 11px/1 "JetBrains Mono", monospace;
  letter-spacing: .34em;
}

.app-shell[data-design="1"] .kicker {
  font-family: "Fraunces", Georgia, serif;
  font-size: 14px;
  letter-spacing: .22em;
  font-style: italic;
}

.app-shell[data-design="3"] .kicker {
  font-family: "Archivo Black", sans-serif;
  letter-spacing: .18em;
}

.type-line {
  margin: 0;
  width: 100%;
  display: flex;
  align-items: baseline;
  justify-content: center;
  flex-wrap: wrap;
  font-family: var(--type-font);
  font-size: clamp(2.35rem, 7.2vw, 6.5rem);
  line-height: 1.04;
  letter-spacing: -.02em;
  font-weight: 700;
}

.app-shell[data-design="1"] .type-line {
  font-weight: 600;
  letter-spacing: .02em;
}

.app-shell[data-design="2"] .type-line {
  font-weight: 800;
  letter-spacing: -.04em;
}

.app-shell[data-design="3"] .type-line {
  font-weight: 400;
  letter-spacing: -.01em;
}

.typed {
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  color: var(--type-color);
  transition: color .8s ease;
}

.app-shell[data-design="3"] .typed {
  background: linear-gradient(100deg, #5cf5ff 0%, #ff7ad9 48%, #ffd166 100%);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}

.cursor {
  display: inline-block;
  width: 2px;
  height: .84em;
  margin-left: .1em;
  flex: none;
  background: #fff;
  border-radius: 2px;
  box-shadow: 0 0 18px rgba(255,255,255,.7);
  transform: translateY(.09em);
  transition: all .8s;
}

.app-shell[data-design="1"] .cursor {
  width: 2px;
  height: 1em;
  background: #1d1a15;
  border-radius: 0;
  box-shadow: none;
}

.app-shell[data-design="2"] .cursor {
  width: .55em;
  height: .88em;
  background: #3dff7a;
  border-radius: 0;
  box-shadow: 0 0 18px rgba(61,255,122,.7);
}

.app-shell[data-design="3"] .cursor {
  width: .22em;
  height: .88em;
  background: #ffd166;
  border-radius: 999px;
  box-shadow: 0 0 22px rgba(255,209,102,.9);
}

.cursor.solid {
  animation: none;
  opacity: 1;
}

.cursor.blink {
  animation: blink 1.05s steps(1) infinite;
}

.cursor.paused {
  animation: blink 1.05s steps(1) infinite;
}

.stage-label {
  margin: 42px 0 0;
  min-height: 1.4em;
  color: var(--accent);
  font-size: 13px;
  font-weight: 600;
  letter-spacing: .06em;
  font-variant-numeric: tabular-nums;
}

@keyframes blink {
  0%, 49% {
    opacity: 1;
  }

  50%, 100% {
    opacity: 0;
  }
}

.status-row {
  margin-top: 42px;
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  justify-content: center;
  gap: 14px;
  color: #9aa3ae;
  font-size: 13px;
  font-variant-numeric: tabular-nums;
}

.status-row strong {
  color: #f4f5f6;
  font-weight: 600;
}

.status-sep {
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: #39404a;
}

.phase-label {
  color: var(--ga);
  text-transform: capitalize;
  font-weight: 600;
}

.progress-track {
  width: min(320px, 70vw);
  height: 2px;
  background: rgba(255,255,255,.09);
  margin-top: 17px;
  overflow: hidden;
  border-radius: 999px;
}

.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--ga), var(--gc));
  transition: width .12s linear;
}

.control-zone {
  width: 100%;
  padding: 0 20px 26px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 15px;
}

.keyboard-hint {
  margin: 0;
  color: var(--muted);
  font-size: 12px;
  display: flex;
  align-items: center;
  gap: 8px;
}

kbd {
  border: 1px solid var(--line);
  border-bottom-width: 2px;
  border-radius: 5px;
  padding: 3px 7px;
  color: var(--control-text);
  font-family: "JetBrains Mono", monospace;
  font-size: 10px;
  background: var(--control-bg);
}

.controls {
  display: flex;
  align-items: center;
  justify-content: center;
  flex-wrap: wrap;
  gap: 8px;
}

.controls button {
  border: 1px solid var(--line);
  background: var(--control-bg);
  color: var(--control-text);
  border-radius: 999px;
  cursor: pointer;
  transition: .2s ease;
}

.controls button:hover {
  border-color: var(--accent);
  transform: translateY(-1px);
}

.controls button:focus-visible {
  outline: 2px solid var(--ga);
  outline-offset: 3px;
}

.play-btn, .skip-btn {
  height: 42px;
  padding: 0 17px;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-weight: 600;
  font-size: 13px;
}

.app-shell[data-design="1"] .play-btn {
  background: #1d1a15 !important;
  color: #f6f0e2 !important;
  border-color: #1d1a15 !important;
}

.app-shell[data-design="2"] .play-btn {
  background: #3dff7a !important;
  color: #020603 !important;
  border-color: #3dff7a !important;
}

.app-shell[data-design="3"] .play-btn {
  background: #ffd166 !important;
  color: #2a0a4a !important;
  border-color: #ffd166 !important;
}

.app-shell[data-design="0"] .play-btn {
  background: #f7f7f7 !important;
  color: #111 !important;
  border-color: #f7f7f7 !important;
}

.segmented {
  display: flex;
  padding: 4px;
  border: 1px solid var(--line);
  background: var(--control-bg);
  border-radius: 999px;
}

.segmented button {
  border: 0 !important;
  background: transparent !important;
  height: 34px;
  padding: 0 13px;
  font-size: 12px;
  font-weight: 500;
}

.segmented button.active {
  background: var(--accent) !important;
  color: #23272e;
}

.app-shell[data-design="1"] .segmented button.active {
  color: #f6f0e2;
}

.app-shell[data-design="2"] .segmented button.active {
  color: #020603;
}

.app-shell[data-design="3"] .segmented button.active {
  color: #2a0a4a;
}

@media (max-width: 650px) {
  .topbar, .design-indicator {
    width: calc(100% - 32px);
    margin-top: 16px;
  }

  .design-indicator {
    margin-top: 14px;
  }

  .stage {
    width: calc(100% - 32px);
  }

  .type-line {
    font-size: clamp(2.15rem, 11.8vw, 3.4rem);
    min-height: 2.2em !important;
  }

  .kicker {
    margin-bottom: 20px;
  }

  .status-row {
    margin-top: 32px;
    gap: 9px;
    font-size: 12px;
  }

  .control-zone {
    gap: 13px;
    padding-bottom: 20px;
  }

  .controls {
    max-width: 390px;
  }

  .segmented button {
    padding: 0 10px;
  }

  .theme-switch {
    order: 3;
  }
}

@media (max-height: 520px) {
  .kicker, .keyboard-hint {
    display: none;
  }

  .status-row {
    margin-top: 18px;
  }
}
</style>
