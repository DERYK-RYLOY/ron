<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="BLACKBOX GRAFX logo">
<title>BLACKBOX GRAFX</title>
<circle cx="100" cy="100" r="100" fill="#101010"/>
<g fill="#ffffff">
  <!-- top stroke with 45-degree down-right fold -->
  <polygon points="52,54 108,54 132,78 52,78"/>
  <!-- fold descending from the top stroke -->
